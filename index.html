<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixel World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Mitr:wght@500;600&family=Pixelify+Sans:wght@500;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <canvas id="view" aria-label="Map"></canvas>
  <div id="top" hidden></div>
  <div id="tools" class="px" hidden></div>
  <div id="pal" class="px" hidden></div>
  <div id="log" aria-live="polite"></div>
  <div id="panel" class="px" hidden></div>
  <div id="dock" hidden>
    <canvas id="mini" class="px" width="316" height="200" aria-label="Minimap"></canvas>
    <div class="row zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button></div>
    <div class="row" id="clock"></div>
    <div class="bar" id="tbar"><i style="background:var(--gold)"></i></div>
    <div class="row"><button id="followBtn"></button><button id="endBtn"></button></div>
  </div>
  <div id="tip" class="px"></div>
  <div id="modal" hidden></div>
</div>
<!-- load order matters: these are plain scripts sharing globals -->
<script src="src/core/data.js" defer></script>
<script src="src/core/game.js" defer></script>
<script src="src/core/ai.js" defer></script>
<script src="src/art/render.js" defer></script>
<script src="src/art/chars.js" defer></script>
<script src="src/art/animals.js" defer></script>
<script src="src/ui/ui.js" defer></script>
</body>
</html>
